# Technitium DNS Server on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=technitium
PKG_TITLE="Technitium DNS Server"
PKG_DESC="Technitium DNS Server in Container Manager: your own DNS server for the whole network, on your Synology. It blocks ads and trackers, answers names you give your own devices (like nas.home), and can encrypt lookups to the internet. A DSM window turns blocking on and off, manages blocklists, local names and upstream DNS, checks DSM isn't using port 53 already, and handles the password, HTTPS, backups and updates."
APP_ID="Technitium.AppInstance"
REPO=tombruton87/technitium-dsm
SERVICES="server"
VOLUMES="config"
IMAGE_VARS="TN_IMAGE"
PORT=5380
PORTS="5380 5381 5390 5480"
HEALTH_PATH=/
APP_ACTIONS="blocking|pause|listadd|listdel|listupdate|domainadd|domaindel|recadd|recdel|zonedel|resolver|newpw|refreshcert"
APP_ANSWER_KEYS="DNS_PORT TLS"
APP_REQUEST_KEYS="PAUSE_MIN URL_B64 KIND DOMAIN REC_TYPE REC_VALUE ZONE RESOLVER UPSTREAM DNS_PROTO CUSTOM_DNS TLS"
TAGLINE="DNS server"
WELCOME="Technitium DNS Server is a full DNS server for your network, running on your Synology. It blocks ads and trackers for every device, answers names you give your own devices (nas.home instead of an IP address) and can encrypt lookups to the internet. This package runs it in Container Manager, sets its admin password, and adds a window to DSM: blocking and blocklists, local names, upstream DNS, and how to point your router at it."
BACKUP_WHAT="Technitium's whole config folder (settings, zones, blocklists, allowed and blocked sites, users, statistics). Technitium is stopped cleanly for the few seconds of the copy, so DNS is away that long."
SITE_NOTE="The address of Technitium's own web console. Devices don't use this for DNS: they use this Synology's address on port 53 (Setup tab). HTTPS can be served with DSM's own certificate (Control Panel → Security → Certificate, the system default; renewals are picked up daily) or a self-signed one."
ICON_TOP="#5b8ef5"
ICON_BOTTOM="#2a55b8"
ICON_LETTER="T"   # only if icon.png is missing
BETA=yes
