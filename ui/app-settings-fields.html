          <option value="bridge">Docker's network — every device shows as Docker's gateway</option>
        </select><span class="hint">Changing it makes Technitium's container again; DNS is away for a few seconds. On the NAS's own network, HTTPS below must be off.</span></label>

          <option value="self">On — self-signed, made by the package</option>
